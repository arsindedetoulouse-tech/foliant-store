name: Android checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, assemble and lint
        run: >-
          ./gradlew :common:data:testDebugUnitTest :feature:home:testDebugUnitTest
          :core:navigation:testDebugUnitTest :app:assembleDebug :app:lintDebug
          --console=plain --stacktrace
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate OpenSpec
        run: npx --yes @fission-ai/openspec@1.13.2 validate --all --strict --no-interactive
